<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crab Hurt & Death Asset Generator (Flat Red & Scaled Ash)</title>
    <style>
        body {
            background-color: #0f172a;
            color: #fef3c7;
            font-family: 'Georgia', serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #ef4444; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 14px; margin-top: 0; }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        canvas {
            background-color: #ffffff;
            background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                              linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                              linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 2px solid #475569;
            border-radius: 8px;
            margin-bottom: 12px;
            display: block;
        }
        button {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #fef3c7;
            border: 1px solid #6ee7b7;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <h1>🦀 Crab Hurt & Death Asset Generator 💥</h1>
    <p>Solid Flat Red Tint + Scaled Ash Particles — Transparent PNG Export</p>

    <div class="container">
        <!-- Frame 1: Red Hurt -->
        <div class="card">
            <h3>1. Crab Idle Red</h3>
            <canvas id="canvasRed" width="300" height="300"></canvas>
            <button onclick="downloadAsset('canvasRed', 'crab_idle_red.png')">Download Red PNG</button>
        </div>

        <!-- Frame 2: Normal Ash -->
        <div class="card">
            <h3>2. Crab Idle Ash</h3>
            <canvas id="canvasAsh" width="300" height="300"></canvas>
            <button onclick="downloadAsset('canvasAsh', 'crab_idle_ash.png')">Download Ash PNG</button>
        </div>

        <!-- Frame 3: Red Ash -->
        <div class="card">
            <h3>3. Crab Idle Red Ash</h3>
            <canvas id="canvasRedAsh" width="300" height="300"></canvas>
            <button onclick="downloadAsset('canvasRedAsh', 'crab_idle_red_ash.png')">Download Red Ash PNG</button>
        </div>
    </div>

    <script>
        function drawPolygon(ctx, points, fillColor, strokeColor) {
            ctx.fillStyle = fillColor;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let p = 1; p < points.length; p++) {
                ctx.lineTo(points[p].x, points[p].y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 1.1;
            ctx.stroke();
        }

        // Scaled up ash particles matching the player reference style
        function drawScaledAsh(ctx, cx, cy, count, spreadX, spreadY) {
            const grayShades = ['#1e293b', '#334155', '#475569', '#64748b', '#94a3b8', '#cbd5e1'];
            for (let i = 0; i < count; i++) {
                let px = cx + (Math.random() - 0.5) * spreadX;
                let py = cy + (Math.random() - 0.5) * spreadY;
                let size = Math.random() * 6 + 3; // Larger particle sizing
                ctx.fillStyle = grayShades[Math.floor(Math.random() * grayShades.length)];
                ctx.fillRect(px, py, size, size);
            }
        }

        function drawCrab(ctx, isFlatRed, includeAsh) {
            ctx.save();
            ctx.translate(150, 160);
            
            let scale = 1.8;
            ctx.scale(scale, scale);

            // If flat red, use a single solid color for everything (no shading)
            const colTopLight  = isFlatRed ? '#991b1b' : '#f87171';
            const colPrimary   = isFlatRed ? '#991b1b' : '#dc2626';
            const colShadow    = isFlatRed ? '#991b1b' : '#b91c1c';
            const colDeepCore  = isFlatRed ? '#991b1b' : '#991b1b';
            const colOutline   = '#450a0a';

            // Background Legs
            for (let side = -1; side <= 1; side += 2) {
                for (let i = 0; i < 3; i++) {
                    let dir = side;
                    let bx = dir * (24 + i * 4);
                    let by = 10 + (i * 5);
                    let mx = dir * (48 + i * 6);
                    let my = 20 + (i * 5);
                    let tx = dir * (38 + i * 6);
                    let ty = 44 + (i * 4);

                    drawPolygon(ctx, [
                        {x: bx, y: by}, {x: mx, y: my}, {x: tx, y: ty}, {x: bx + dir*3, y: by + 5}
                    ], colDeepCore, colOutline);
                }
            }

            // High-Polygon Carapace Mesh
            drawPolygon(ctx, [{x: -30, y: -22}, {x: 30, y: -22}, {x: 30, y: 26}, {x: -30, y: 26}], colPrimary, colOutline);
            drawPolygon(ctx, [{x: 0, y: -28}, {x: -22, y: -16}, {x: -24, y: 6}, {x: 0, y: 22}], colTopLight, colOutline);
            drawPolygon(ctx, [{x: 0, y: -28}, {x: 22, y: -16}, {x: 24, y: 6}, {x: 0, y: 22}], colPrimary, colOutline);
            drawPolygon(ctx, [{x: -22, y: -16}, {x: -28, y: -4}, {x: -26, y: 16}, {x: -24, y: 6}], colPrimary, colOutline);
            drawPolygon(ctx, [{x: 22, y: -16}, {x: 28, y: -4}, {x: 26, y: 16}, {x: 24, y: 6}], colShadow, colOutline);
            drawPolygon(ctx, [{x: -28, y: -4}, {x: -32, y: 8}, {x: -28, y: 24}, {x: -26, y: 16}], colShadow, colOutline);
            drawPolygon(ctx, [{x: 28, y: -4}, {x: 32, y: 8}, {x: 28, y: 24}, {x: 26, y: 16}], colDeepCore, colOutline);
            drawPolygon(ctx, [{x: -24, y: 16}, {x: 24, y: 16}, {x: 18, y: 26}, {x: -18, y: 26}], colShadow, colOutline);
            drawPolygon(ctx, [{x: 0, y: -28}, {x: -5, y: -8}, {x: 0, y: 26}, {x: 5, y: -8}], colTopLight, colOutline);

            // Foreground Legs
            for (let side = -1; side <= 1; side += 2) {
                let dir = side;
                let bx = dir * 26, by = 16, mx = dir * 52, my = 28, tx = dir * 42, ty = 50;
                drawPolygon(ctx, [{x: bx, y: by}, {x: mx, y: my}, {x: mx - dir*4, y: my + 7}, {x: bx - dir*3, y: by + 7}], colPrimary, colOutline);
                drawPolygon(ctx, [{x: mx, y: my}, {x: tx, y: ty}, {x: tx - dir*5, y: ty + 4}, {x: mx - dir*4, y: my + 7}], colShadow, colOutline);
            }

            // Eyes & Stalks
            for (let side = -1; side <= 1; side += 2) {
                let dir = side;
                drawPolygon(ctx, [{x: dir*6, y: -18}, {x: dir*12, y: -20}, {x: dir*11, y: -32}, {x: dir*5, y: -30}], colDeepCore, colOutline);
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(dir * 8.5, -35, 3.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = colOutline;
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(dir * 7.4, -36.2, 1.2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Claws
            function drawClaw(dir, isOpen) {
                ctx.save();
                ctx.translate(dir * 20, -14);
                ctx.fillStyle = colDeepCore;
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = colOutline;
                ctx.lineWidth = 1.1;
                ctx.stroke();

                drawPolygon(ctx, [{x: 0, y: 0}, {x: dir * 14, y: -20}, {x: dir * 10, y: -28}, {x: -dir * 4, y: -10}], colPrimary, colOutline);
                drawPolygon(ctx, [{x: dir * 14, y: -20}, {x: dir * 26, y: -38}, {x: dir * 18, y: -46}, {x: dir * 8, y: -28}], colShadow, colOutline);
                drawPolygon(ctx, [{x: dir * 18, y: -46}, {x: dir * 42, y: -64}, {x: dir * 30, y: -80}, {x: dir * 12, y: -58}], colPrimary, colOutline);
                drawPolygon(ctx, [{x: dir * 30, y: -80}, {x: dir * 42, y: -64}, {x: dir * 36, y: -54}, {x: dir * 22, y: -68}], colTopLight, colOutline);

                ctx.save();
                ctx.translate(dir * 18, -46);
                ctx.rotate(isOpen ? -dir * 0.55 : -dir * 0.05);
                ctx.translate(-dir * 18, 46);
                drawPolygon(ctx, [{x: dir * 18, y: -46}, {x: dir * 32, y: -34}, {x: dir * 40, y: -46}, {x: dir * 28, y: -56}], colShadow, colOutline);
                ctx.restore();
                ctx.restore();
            }

            drawClaw(-1, true);
            drawClaw(1, true);

            ctx.restore();

            if (includeAsh) {
                drawScaledAsh(ctx, 150, 150, 45, 90, 100);
            }
        }

        function init() {
            const ctxRed = document.getElementById('canvasRed').getContext('2d');
            ctxRed.clearRect(0, 0, 300, 300);
            drawCrab(ctxRed, true, false);

            const ctxAsh = document.getElementById('canvasAsh').getContext('2d');
            ctxAsh.clearRect(0, 0, 300, 300);
            drawCrab(ctxAsh, false, true);

            const ctxRedAsh = document.getElementById('canvasRedAsh').getContext('2d');
            ctxRedAsh.clearRect(0, 0, 300, 300);
            drawCrab(ctxRedAsh, true, true);
        }

        function downloadAsset(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.onload = init;
    </script>

</body>
</html>
