<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cave Bat Mob - Back View Flight Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
    }
    .pixelated {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .checkerboard {
      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 sm:p-8">

  <!-- Header -->
  <header class="text-center mb-8 max-w-2xl">
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">🦇 Low-Poly Cave Bat (Back View)</h1>
    <p class="text-slate-400 text-sm">6-Frame Wing Flapping Flight Cycle (Rear View - 300px × 300px Sprites)</p>
  </header>

  <!-- Main Grid -->
  <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">

    <!-- Controls Panel -->
    <div class="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col gap-5">
      <h2 class="text-xs font-bold uppercase tracking-wider text-purple-400">Animation Controls</h2>

      <div class="space-y-1">
        <label class="text-sm font-medium text-slate-300">Animation Speed (FPS)</label>
        <input type="range" id="animSpeed" min="2" max="12" value="8" class="w-full accent-purple-500">
      </div>

      <div class="space-y-1">
        <label class="text-sm font-medium text-slate-300">Frame Size</label>
        <input type="text" value="300 x 300 px" readonly class="w-full bg-slate-800/50 border border-slate-700/50 text-slate-400 rounded-lg px-3 py-2 font-mono text-sm outline-none cursor-not-allowed">
      </div>

      <button onclick="downloadSpritesheet()" class="w-full py-3 px-4 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-xl shadow-lg shadow-purple-600/30 transition-all flex items-center justify-center gap-2 mt-4">
        💾 Export Back Spritesheet PNG
      </button>
    </div>

    <!-- Preview Display Area -->
    <div class="lg:col-span-3 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col gap-6">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h2 class="text-sm font-bold uppercase tracking-wider text-purple-400">Live Animation Loop</h2>
        <span class="text-xs text-slate-400">Back Facing Flight Motion</span>
      </div>

      <!-- Live Preview Canvas -->
      <div class="flex flex-col items-center justify-center checkerboard p-8 rounded-xl border border-slate-800 shadow-inner gap-4">
        <canvas id="previewCanvas" width="300" height="300" class="pixelated w-[200px] h-[200px] border border-slate-700/50 rounded-xl shadow-lg bg-transparent"></canvas>
        <span class="text-xs font-mono text-slate-400">Rear Flapping Cycle Preview</span>
      </div>

      <!-- Individual 6 Frames View -->
      <div class="flex flex-col gap-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">All 6 Back Movement Frames</h3>
        <div id="framesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 justify-items-center">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <script>
    const FRAME_SIZE = 300;
    const TOTAL_FRAMES = 6;
    let currentFrame = 0;
    let animInterval = null;

    function drawBatBack(ctx, frameIdx) {
      ctx.clearRect(0, 0, FRAME_SIZE, FRAME_SIZE);

      const cx = 150;
      // Vertical bobbing synchronized with front view
      const bobY = Math.sin((frameIdx / TOTAL_FRAMES) * Math.PI * 2) * 6;
      const cy = 150 + bobY;

      // Wing Flap Phase Angle (-1 to 1) matching front view cycle
      const flapAngles = [ -1.0, -0.5, 0.2, 0.9, 0.4, -0.4 ];
      const wingPhase = flapAngles[frameIdx];

      ctx.save();

      // Low-Poly Dark Slate Purple Palette (Rear Lighting)
      const bodyDark = '#141221';
      const bodyMid = '#1e1b2e';
      const bodyLight = '#2e2a4a';
      const wingMembrane = '#12101e';
      const wingMembraneInner = '#1a1829';
      const wingMembraneLower = '#171526';
      const wingBone = '#0b0a13';
      const outline = '#050409';

      function drawPoly(pts, fill, stroke = outline, lineW = 2.5) {
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) {
          ctx.lineTo(pts[i][0], pts[i][1]);
        }
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineW;
          ctx.stroke();
        }
      }

      // --- WINGS (DRAWN BEHIND BACK TORSO) ---
      const wingYOffset = cy - 5;
      const wingTipY = wingYOffset + (wingPhase * 65);
      const elbowY = wingYOffset + (wingPhase * 35) - 25;

      // Left Wing Coordinates
      const lElbowX = cx - 55;
      const lTipX = cx - 125;
      const lMidBoneX = cx - 90;
      const lMidBoneY = wingYOffset + (wingPhase * 45) + 30;
      const lLowerTipX = cx - 45;
      const lLowerTipY = wingYOffset + (wingPhase * 25) + 48;

      // Left Wing Membrane Polygons
      drawPoly([[cx - 12, wingYOffset - 5], [lElbowX, elbowY], [lMidBoneX, lMidBoneY]], wingMembraneInner);
      drawPoly([[lElbowX, elbowY], [lTipX, wingTipY], [lMidBoneX, lMidBoneY]], wingMembrane);
      drawPoly([[cx - 12, wingYOffset - 5], [lMidBoneX, lMidBoneY], [lLowerTipX, lLowerTipY]], wingMembraneInner);
      drawPoly([[cx - 12, wingYOffset + 15], [lLowerTipX, lLowerTipY], [cx - 12, cy + 25]], wingMembraneLower);

      // Left Wing Bone Struts (Back side layer)
      drawPoly([[cx - 12, wingYOffset - 5], [lElbowX, elbowY], [lTipX, wingTipY], [lElbowX - 2, elbowY + 4]], wingBone);
      drawPoly([[lElbowX, elbowY], [lMidBoneX, lMidBoneY]], wingBone);

      // Right Wing Coordinates
      const rElbowX = cx + 55;
      const rTipX = cx + 125;
      const rMidBoneX = cx + 90;
      const rMidBoneY = wingYOffset + (wingPhase * 45) + 30;
      const rLowerTipX = cx + 45;
      const rLowerTipY = wingYOffset + (wingPhase * 25) + 48;

      // Right Wing Membrane Polygons
      drawPoly([[cx + 12, wingYOffset - 5], [rElbowX, elbowY], [rMidBoneX, rMidBoneY]], wingMembraneInner);
      drawPoly([[rElbowX, elbowY], [rTipX, wingTipY], [rMidBoneX, rMidBoneY]], wingMembrane);
      drawPoly([[cx + 12, wingYOffset - 5], [rMidBoneX, rMidBoneY], [rLowerTipX, rLowerTipY]], wingMembraneInner);
      drawPoly([[cx + 12, wingYOffset + 15], [rLowerTipX, rLowerTipY], [cx + 12, cy + 25]], wingMembraneLower);

      // Right Wing Bone Struts
      drawPoly([[cx + 12, wingYOffset - 5], [rElbowX, elbowY], [rTipX, wingTipY], [rElbowX + 2, elbowY + 4]], wingBone);
      drawPoly([[rElbowX, elbowY], [rMidBoneX, rMidBoneY]], wingBone);


      // --- BACK OF HEAD & EARS (NO FACE/EYES/FANGS) ---
      // Left Ear Back
      drawPoly([[cx - 18, cy - 12], [cx - 28, cy - 42], [cx - 6, cy - 22]], bodyMid);
      drawPoly([[cx - 16, cy - 14], [cx - 25, cy - 38], [cx - 8, cy - 21]], bodyDark);

      // Right Ear Back
      drawPoly([[cx + 6, cy - 22], [cx + 28, cy - 42], [cx + 18, cy - 12]], bodyMid);
      drawPoly([[cx + 8, cy - 21], [cx + 25, cy - 38], [cx + 16, cy - 14]], bodyDark);

      // Back of Head
      drawPoly([[cx - 16, cy - 24], [cx, cy - 28], [cx + 16, cy - 24], [cx, cy - 8]], bodyMid);


      // --- REAR TORSO & SPINE MESH ---
      // Low-poly faceted back body
      drawPoly([[cx, cy - 22], [cx - 20, cy - 5], [cx - 14, cy + 28], [cx, cy + 38]], bodyDark);
      drawPoly([[cx, cy - 22], [cx + 20, cy - 5], [cx + 14, cy + 28], [cx, cy + 38]], bodyMid);

      // Spine Center Line & Back Shoulders
      drawPoly([[cx, cy - 20], [cx - 12, cy - 6], [cx, cy + 20]], bodyDark);
      drawPoly([[cx, cy - 20], [cx + 12, cy - 6], [cx, cy + 20]], bodyMid);

      // Small Tail Tip
      drawPoly([[cx - 4, cy + 32], [cx, cy + 42], [cx + 4, cy + 32]], bodyDark);

      ctx.restore();
    }

    function renderAllFrames() {
      const container = document.getElementById('framesGrid');
      container.innerHTML = '';

      for (let i = 0; i < TOTAL_FRAMES; i++) {
        const canvas = document.createElement('canvas');
        canvas.width = FRAME_SIZE;
        canvas.height = FRAME_SIZE;
        canvas.className = 'pixelated w-[90px] h-[90px] border border-slate-700/60 rounded-xl bg-slate-950 shadow-md';
        
        drawBatBack(canvas.getContext('2d'), i);

        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col items-center gap-1';
        
        const label = document.createElement('span');
        label.className = 'text-[10px] font-mono text-slate-400';
        label.innerText = `Frame ${i + 1}`;

        wrapper.appendChild(canvas);
        wrapper.appendChild(label);
        container.appendChild(wrapper);
      }
    }

    function startAnimation() {
      if (animInterval) clearInterval(animInterval);
      const fps = parseInt(document.getElementById('animSpeed').value) || 8;
      const pCtx = document.getElementById('previewCanvas').getContext('2d');

      animInterval = setInterval(() => {
        pCtx.clearRect(0, 0, FRAME_SIZE, FRAME_SIZE);
        drawBatBack(pCtx, currentFrame);
        currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
      }, 1000 / fps);
    }

    document.getElementById('animSpeed').oninput = startAnimation;

    function downloadSpritesheet() {
      const sheetCanvas = document.createElement('canvas');
      sheetCanvas.width = FRAME_SIZE * TOTAL_FRAMES;
      sheetCanvas.height = FRAME_SIZE;
      const sCtx = sheetCanvas.getContext('2d');

      for (let i = 0; i < TOTAL_FRAMES; i++) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = FRAME_SIZE;
        tempCanvas.height = FRAME_SIZE;
        drawBatBack(tempCanvas.getContext('2d'), i);
        sCtx.drawImage(tempCanvas, i * FRAME_SIZE, 0);
      }

      const link = document.createElement('a');
      link.download = 'bat_back_flight_spritesheet.png';
      link.href = sheetCanvas.toDataURL('image/png');
      link.click();
    }

    window.onload = () => {
      renderAllFrames();
      startAnimation();
    };
  </script>
</body>
</html>
