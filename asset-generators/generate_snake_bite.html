<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Hurt & Death Animation Generator (300x300)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
    }
    .pixelated {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .checkerboard {
      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 sm:p-8">

  <!-- Header -->
  <header class="text-center mb-8 max-w-2xl">
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">Snake Hurt & Death Generator</h1>
    <p class="text-slate-400 text-sm">Uses your exact pose reference with a red-tinted damage hit flash for the hurt state, followed by a limp recoil and fade-out death sequence.</p>
  </header>

  <!-- Main Content Grid -->
  <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">

    <!-- Controls Panel -->
    <div class="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col gap-5">
      <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-400">Animation Controls</h2>

      <div class="space-y-1">
        <label class="text-sm font-medium text-slate-300">Animation Speed (FPS)</label>
        <input type="range" id="animSpeed" min="2" max="10" value="4" class="w-full accent-emerald-500">
      </div>

      <div class="space-y-1">
        <label class="text-sm font-medium text-slate-300">Total Frames</label>
        <input type="text" value="6 Frames (2 Hurt + 4 Death)" readonly class="w-full bg-slate-800/50 border border-slate-700/50 text-slate-400 rounded-lg px-3 py-2 font-mono text-sm outline-none cursor-not-allowed">
      </div>

      <button onclick="downloadSpriteSheet()" class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2 mt-4">
        Export Spritesheet PNG (6 Frames)
      </button>
    </div>

    <!-- Preview Display Area -->
    <div class="lg:col-span-3 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col gap-6">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h2 class="text-sm font-bold uppercase tracking-wider text-emerald-400">Live Preview</h2>
        <span class="text-xs text-slate-400">Hurt Flash ➔ Death Collapse</span>
      </div>

      <!-- Live Loop Preview Box -->
      <div class="flex flex-col items-center justify-center checkerboard p-8 rounded-xl border border-slate-800 shadow-inner gap-4">
        <canvas id="previewCanvas" width="300" height="300" class="pixelated w-[200px] h-[200px] border border-slate-700/50 rounded-xl shadow-lg bg-transparent"></canvas>
        <span class="text-xs font-mono text-slate-400" id="frameDesc">Frame 1: Red Hurt Flash</span>
      </div>

      <div class="flex flex-col gap-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">All 6 Animation Frames</h3>
        <div id="framesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 justify-items-center">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <script>
    const FRAME_SIZE = 300;
    const TOTAL_FRAMES = 6;
    let currentFrame = 0;
    let animInterval = null;

    function initGenerator() {
      renderAllFrames();
      startAnimation();
    }

    function renderHurtDeathFrame(ctx, frameIdx) {
      ctx.clearRect(0, 0, FRAME_SIZE, FRAME_SIZE);

      const segments = 24;
      let points = [];

      // Determine state parameters
      let isHurt = (frameIdx < 2); // Frames 0 and 1 are Hurt states
      let isDeath = (frameIdx >= 2); // Frames 2-5 are Death collapse states
      let redTintAlpha = frameIdx === 0 ? 0.75 : (frameIdx === 1 ? 0.35 : 0);
      let deathProgress = isDeath ? (frameIdx - 2) / 3 : 0; // 0 to 1 collapse progress

      // Base snake curve from your exact image reference
      for (let i = 0; i <= segments; i++) {
        let t = i / segments;

        let baseX = 80 + (t * 160);
        let baseY = 100 + Math.sin(t * Math.PI * 2.5) * 55 + (t * 40);

        // Recoil displacement on hit (shake)
        let shakeX = isHurt ? (frameIdx % 2 === 0 ? 6 : -6) : 0;
        let shakeY = isHurt ? (frameIdx % 2 === 0 ? -4 : 4) : 0;

        // Death collapse: flattening down to the ground
        let collapseY = deathProgress * (80 * (1 - t * 0.5));
        let collapseX = deathProgress * 15 * (1 - t);

        let x = baseX + shakeX + collapseX;
        let y = baseY + shakeY + collapseY;

        points.push({ x, y, t });
      }

      ctx.save();
      if (isDeath) {
        // Fade opacity as it dies
        ctx.globalAlpha = Math.max(0, 1 - (deathProgress * 0.7));
      }

      // Draw body segments
      for (let i = 0; i < points.length - 1; i++) {
        let p1 = points[i];
        let p2 = points[i + 1];

        let w1 = 4 + (p1.t * 26);
        let w2 = 4 + (p2.t * 26);

        let dx = p2.x - p1.x;
        let dy = p2.y - p1.y;
        let len = Math.hypot(dx, dy) || 1;
        let nx = -dy / len;
        let ny = dx / len;

        let baseColor = (i % 2 === 0) ? '#0f3d1e' : '#144c26';
        let highlightColor = (i % 2 === 0) ? '#1b6b35' : '#228643';

        ctx.strokeStyle = '#071f10';
        ctx.lineWidth = 2.5;

        // Left facet
        ctx.fillStyle = baseColor;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p2.x + nx * w2, p2.y + ny * w2);
        ctx.lineTo(p1.x + nx * w1, p1.y + ny * w1);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Right facet (highlight)
        ctx.fillStyle = highlightColor;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p2.x - nx * w2, p2.y - ny * w2);
        ctx.lineTo(p1.x - nx * w1, p1.y - ny * w1);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // Head shape
      let head = points[points.length - 1];
      let neck = points[points.length - 2];
      let hAngle = Math.atan2(head.y - neck.y, head.x - neck.x);

      ctx.save();
      ctx.translate(head.x, head.y);
      ctx.rotate(hAngle - Math.PI / 2);

      // Head armor
      ctx.fillStyle = '#228643';
      ctx.strokeStyle = '#071f10';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(0, 18); 
      ctx.lineTo(26, -10); 
      ctx.lineTo(-26, -10); 
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Crown ridge
      ctx.fillStyle = '#2bb653';
      ctx.beginPath();
      ctx.moveTo(0, 12);
      ctx.lineTo(12, -4);
      ctx.lineTo(-12, -4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Eyes (Normal vs Dead 'X' Eyes)
      if (isDeath) {
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 3;
        // Left Eye 'X'
        ctx.beginPath();
        ctx.moveTo(-15, -7); ctx.lineTo(-9, -1);
        ctx.moveTo(-9, -7); ctx.lineTo(-15, -1);
        ctx.stroke();
        // Right Eye 'X'
        ctx.beginPath();
        ctx.moveTo(9, -7); ctx.lineTo(15, -1);
        ctx.moveTo(15, -7); ctx.lineTo(9, -1);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-12, -4, 5, 0, Math.PI * 2);
        ctx.arc(12, -4, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(-14, -7, 2, 2);
        ctx.fillRect(12, -7, 2, 2);
      }

      ctx.restore();

      // Red Damage Tint Overlay for Hurt states
      if (redTintAlpha > 0) {
        ctx.globalCompositeOperation = 'source-atop';
        ctx.fillStyle = `rgba(220, 38, 38, ${redTintAlpha})`;
        ctx.fillRect(0, 0, FRAME_SIZE, FRAME_SIZE);
        ctx.globalCompositeOperation = 'source-over';
      }

      ctx.restore();
    }

    function renderAllFrames() {
      const container = document.getElementById('framesGrid');
      container.innerHTML = '';

      const frameLabels = [
        'Hurt 1 (Red Flash)',
        'Hurt 2 (Recoil)',
        'Death 1 (Collapse)',
        'Death 2 (Slump)',
        'Death 3 (Limp)',
        'Death 4 (Fade Out)'
      ];

      for (let i = 0; i < TOTAL_FRAMES; i++) {
        const canvas = document.createElement('canvas');
        canvas.width = FRAME_SIZE;
        canvas.height = FRAME_SIZE;
        canvas.className = 'pixelated w-[80px] h-[80px] border border-slate-700/60 rounded-xl bg-slate-950 shadow-md';
        
        renderHurtDeathFrame(canvas.getContext('2d'), i);

        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col items-center gap-1';
        
        const label = document.createElement('span');
        label.className = 'text-[10px] font-mono text-slate-400 text-center';
        label.innerText = frameLabels[i];

        wrapper.appendChild(canvas);
        wrapper.appendChild(label);
        container.appendChild(wrapper);
      }
    }

    function startAnimation() {
      if (animInterval) clearInterval(animInterval);
      const fps = parseInt(document.getElementById('animSpeed').value) || 4;
      const pCtx = document.getElementById('previewCanvas').getContext('2d');
      const descEl = document.getElementById('frameDesc');

      const frameLabels = [
        'Frame 1: Hurt Red Flash',
        'Frame 2: Hurt Recoil Recovery',
        'Frame 3: Death Collapse Start',
        'Frame 4: Death Slump',
        'Frame 5: Limp Dead State',
        'Frame 6: Fade Out Completion'
      ];

      animInterval = setInterval(() => {
        pCtx.clearRect(0, 0, FRAME_SIZE, FRAME_SIZE);
        renderHurtDeathFrame(pCtx, currentFrame);
        descEl.innerText = frameLabels[currentFrame];
        currentFrame = (currentFrame + 1) % TOTAL_FRAMES;
      }, 1000 / fps);
    }

    document.getElementById('animSpeed').oninput = startAnimation;

    function downloadSpriteSheet() {
      const sheetCanvas = document.createElement('canvas');
      sheetCanvas.width = FRAME_SIZE * TOTAL_FRAMES;
      sheetCanvas.height = FRAME_SIZE;
      const sCtx = sheetCanvas.getContext('2d');

      for (let i = 0; i < TOTAL_FRAMES; i++) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = FRAME_SIZE;
        tempCanvas.height = FRAME_SIZE;
        renderHurtDeathFrame(tempCanvas.getContext('2d'), i);
        sCtx.drawImage(tempCanvas, i * FRAME_SIZE, 0);
      }

      const link = document.createElement('a');
      link.download = 'snake_hurt_death_spritesheet.png';
      link.href = sheetCanvas.toDataURL('image/png');
      link.click();
    }

    window.onload = initGenerator;
  </script>
</body>
</html>
