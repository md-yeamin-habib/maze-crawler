<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plain Brick Sewer Wall Generator (1x3)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
    }
    .pixelated {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 sm:p-8">

  <!-- Header -->
  <header class="text-center mb-8 max-w-2xl">
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">Plain Brick Sewer Wall (1x3)</h1>
    <p class="text-slate-400 text-sm">Clean grayish brick tile texture with subtle stone cracks—no moss, no pipes.</p>
  </header>

  <!-- Main Content Grid -->
  <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col items-center gap-6">
    <h2 class="text-xs font-bold uppercase tracking-wider text-indigo-400 self-start">Asset Preview (60x180px)</h2>

    <div class="w-full flex items-center justify-center bg-slate-950 p-6 rounded-xl border border-slate-800 shadow-inner">
      <canvas id="wallCanvas" width="60" height="180" class="pixelated w-[100px] h-[300px] border border-slate-700/80 rounded shadow-lg bg-[#262930]"></canvas>
    </div>

    <div class="flex gap-4 w-full">
      <button onclick="generatePlainWall()" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
        Regenerate Cracks
      </button>
      <button onclick="downloadWall()" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-semibold rounded-xl transition-all flex items-center justify-center gap-2">
        Download PNG (60x180)
      </button>
    </div>
  </div>

  <script>
    class Random {
      constructor(seed) {
        this.seed = seed % 2147483647;
        if (this.seed <= 0) this.seed += 2147483646;
      }
      next() {
        this.seed = (this.seed * 16807) % 2147483647;
        return (this.seed - 1) / 2147483646;
      }
      range(min, max) { return min + this.next() * (max - min); }
      int(min, max) { return Math.floor(this.range(min, max + 1)); }
    }

    function generatePlainWall() {
      const canvas = document.getElementById('wallCanvas');
      const ctx = canvas.getContext('2d');
      const w = 60;
      const h = 180;
      const rng = new Random(Math.floor(Math.random() * 10000));

      ctx.clearRect(0, 0, w, h);

      // 1. Gray Brick Background
      ctx.fillStyle = '#262930';
      ctx.fillRect(0, 0, w, h);

      const brickRows = 12;
      const rowH = h / brickRows;
      const brickCols = 2;
      const colW = w / brickCols;

      for (let r = 0; r < brickRows; r++) {
        for (let c = 0; c <= brickCols; c++) {
          const bx = c * colW - ((r % 2 === 0) ? 0 : colW / 2);
          const by = r * rowH;
          const bw = colW;
          const bh = rowH;

          // Subtle stone shade variation
          const shade = rng.int(34, 52);
          ctx.fillStyle = `rgb(${shade}, ${shade + 2}, ${shade + 6})`;
          ctx.fillRect(bx + 1, by + 1, bw - 2, bh - 2);

          // Dark mortar lines
          ctx.fillStyle = '#17191e';
          ctx.fillRect(bx, by + bh - 1, bw, 1);
          ctx.fillRect(bx + bw - 1, by, 1, bh);
        }
      }

      // 2. Add subtle stone cracks (no moss, no pipes)
      const crackCount = rng.int(2, 4);
      for (let i = 0; i < crackCount; i++) {
        const cx = rng.range(10, w - 10);
        const cy = rng.range(20, h - 20);
        
        ctx.strokeStyle = '#121418';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + rng.int(-6, 8), cy + rng.int(6, 14));
        ctx.lineTo(cx + rng.int(-10, 4), cy + rng.int(16, 24));
        ctx.stroke();
      }
    }

    function downloadWall() {
      const canvas = document.getElementById('wallCanvas');
      const link = document.createElement('a');
      link.download = 'sewer_plain_brick_wall_60x180.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    window.onload = () => {
      generatePlainWall();
    };
  </script>
</body>
</html>
