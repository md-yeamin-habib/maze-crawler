<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clustered 3-Segment Crab Appendages Generator</title>
    <style>
        body {
            background-color: #0f172a;
            color: #fef3c7;
            font-family: 'Georgia', serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #ef4444; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 14px; margin-top: 0; }
        .controls {
            margin: 20px 0;
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            border: 1px solid #334155;
        }
        button {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #fef3c7;
            border: 1px solid #fca5a5;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            margin: 5px;
            font-size: 14px;
        }
        button:hover { opacity: 0.9; }
        button.active { border: 2px solid #ffffff; box-shadow: 0 0 14px rgba(239, 68, 68, 0.9); }
        .canvas-container {
            background: #ffffff;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 10px;
        }
        canvas { display: block; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>Clustered 3-Segment Crab Appendages Generator</h1>
    <p>4 Legs Per Set — Clustered Bases Angling Inward, 3 Segments Each</p>

    <div class="controls">
        <button id="btnNear" onclick="setView('near')" class="active">1. Nearer Legs (Downward Slope)</button>
        <button id="btnFar" onclick="setView('far')">2. Further Legs (Upwards Angle)</button>
        <br><br>
        <button onclick="downloadAsset()" style="background: linear-gradient(135deg, #059669, #10b981);">Download Current Legs PNG</button>
    </div>

    <br>
    <div class="canvas-container">
        <canvas id="crabCanvas" width="500" height="480"></canvas>
    </div>

    <script>
        let currentView = 'near'; // 'near' or 'far'

        function setView(viewType) {
            currentView = viewType;
            document.getElementById('btnNear').className = (viewType === 'near') ? 'active' : '';
            document.getElementById('btnFar').className = (viewType === 'far') ? 'active' : '';
            renderAsset();
        }

        function renderAsset() {
            const canvas = document.getElementById('crabCanvas');
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            
            let scale = 2.2;
            ctx.scale(scale, scale);

            const colPrimary   = '#dc2626';
            const colShadow    = '#b91c1c';
            const colDeepCore  = '#991b1b';
            const colOutline   = '#450a0a';

            function drawPolygon(points, fillColor) {
                ctx.fillStyle = fillColor;
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let p = 1; p < points.length; p++) {
                    ctx.lineTo(points[p].x, points[p].y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = colOutline;
                ctx.lineWidth = 1.1;
                ctx.stroke();
            }

            // Common attachment level near the body base
            const baseY = -15;

            if (currentView === 'near') {
                // --- 1. NEARER SET OF LEGS (Downward slope, clustered bases, 3 segments) ---
                for (let i = 0; i < 4; i++) {
                    // Bases clustered closely together near the center
                    let baseX = -12 + (i * 8); 
                    // Tips fan out wider at the bottom
                    let tipX = -45 + (i * 30); 

                    let midX = (baseX + tipX) / 2;

                    // Segment 1 (Upper block - attached to base)
                    drawPolygon([
                        {x: baseX - 3, y: baseY}, 
                        {x: baseX + 5, y: baseY}, 
                        {x: midX + 4, y: baseY + 20}, 
                        {x: midX - 4, y: baseY + 16}
                    ], colPrimary);

                    // Segment 2 (Middle block)
                    drawPolygon([
                        {x: midX - 4, y: baseY + 16}, 
                        {x: midX + 4, y: baseY + 20}, 
                        {x: tipX + 6, y: baseY + 38}, 
                        {x: tipX - 2, y: baseY + 34}
                    ], colShadow);

                    // Segment 3 (Lower block / tip)
                    drawPolygon([
                        {x: tipX - 2, y: baseY + 34}, 
                        {x: tipX + 6, y: baseY + 38}, 
                        {x: tipX + 4, y: baseY + 52}, 
                        {x: tipX - 4, y: baseY + 48}
                    ], colDeepCore);
                }
            } else {
                // --- 2. FURTHER SET OF LEGS (Upwards angle, clustered bases, 3 segments) ---
                for (let i = 0; i < 4; i++) {
                    // Bases clustered closely together near the center
                    let baseX = -12 + (i * 8); 
                    // Tips fan out wider at the top
                    let tipX = -45 + (i * 30); 

                    let midX = (baseX + tipX) / 2;

                    // Segment 1 (Upper block - attached to base)
                    drawPolygon([
                        {x: baseX - 3, y: baseY}, 
                        {x: baseX + 5, y: baseY}, 
                        {x: midX + 4, y: baseY - 20}, 
                        {x: midX - 4, y: baseY - 16}
                    ], colDeepCore);

                    // Segment 2 (Middle block)
                    drawPolygon([
                        {x: midX - 4, y: baseY - 16}, 
                        {x: midX + 4, y: baseY - 20}, 
                        {x: tipX + 6, y: baseY - 38}, 
                        {x: tipX - 2, y: baseY - 34}
                    ], colShadow);

                    // Segment 3 (Lower block / tip)
                    drawPolygon([
                        {x: tipX - 2, y: baseY - 34}, 
                        {x: tipX + 6, y: baseY - 38}, 
                        {x: tipX + 4, y: baseY - 52}, 
                        {x: tipX - 4, y: baseY - 48}
                    ], colPrimary);
                }
            }

            ctx.restore();
        }

        function downloadAsset() {
            const canvas = document.getElementById('crabCanvas');
            const link = document.createElement('a');
            link.download = `crab_legs_${currentView}_clustered.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.onload = renderAsset;
    </script>

</body>
</html>
