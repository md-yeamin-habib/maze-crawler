<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sewer Dungeon Wall Asset Generator (60x180)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
    }
    .pixelated {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 sm:p-8">

  <!-- Header -->
  <header class="text-center mb-8 max-w-2xl">
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">Sewer Dungeon Wall Generator (60x180)</h1>
    <p class="text-slate-400 text-sm">Fixed 60x180 dimensions with perfectly aligned parallel horizontal pipes and vertical H/I connector drops across variants.</p>
  </header>

  <!-- Main Content Grid -->
  <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">

    <!-- Controls Panel -->
    <div class="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col gap-5">
      <h2 class="text-xs font-bold uppercase tracking-wider text-indigo-400">Generator Controls</h2>

      <div class="space-y-1">
        <label class="text-sm font-medium text-slate-300">Seed Value</label>
        <div class="flex gap-2">
          <input type="number" id="seedInput" value="2026" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white font-mono text-sm outline-none focus:border-indigo-500">
          <button onclick="randomizeSeed()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-sm font-semibold transition-all">🎲</button>
        </div>
      </div>

      <div class="space-y-1">
        <label class="text-sm font-medium text-slate-300">Tile Width (px)</label>
        <input type="number" id="tileWidth" value="60" readonly class="w-full bg-slate-800/50 border border-slate-700/50 text-slate-400 rounded-lg px-3 py-2 font-mono text-sm outline-none cursor-not-allowed">
      </div>

      <div class="space-y-1">
        <label class="text-sm font-medium text-slate-300">Tile Height (px)</label>
        <input type="number" id="tileHeight" value="180" readonly class="w-full bg-slate-800/50 border border-slate-700/50 text-slate-400 rounded-lg px-3 py-2 font-mono text-sm outline-none cursor-not-allowed">
      </div>

      <button onclick="generateAll()" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 mt-2">
        Generate 6 Variants
      </button>

      <button onclick="downloadSpriteSheet()" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-semibold rounded-xl transition-all flex items-center justify-center gap-2">
        Export Spritesheet PNG
      </button>
    </div>

    <!-- Variants Display Area -->
    <div class="lg:col-span-3 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col gap-6">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h2 class="text-sm font-bold uppercase tracking-wider text-indigo-400">Wall Face Variants (60x180)</h2>
        <span class="text-xs text-slate-400">Click any variant to download individually</span>
      </div>

      <!-- Grid of 6 variants -->
      <div id="variantsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-6 justify-items-center">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>

  <script>
    class Random {
      constructor(seed) {
        this.seed = seed % 2147483647;
        if (this.seed <= 0) this.seed += 2147483646;
      }
      next() {
        this.seed = (this.seed * 16807) % 2147483647;
        return (this.seed - 1) / 2147483646;
      }
      range(min, max) { return min + this.next() * (max - min); }
      int(min, max) { return Math.floor(this.range(min, max + 1)); }
    }

    function randomizeSeed() {
      document.getElementById('seedInput').value = Math.floor(Math.random() * 100000);
      generateAll();
    }

    function generateAll() {
      const baseSeed = parseInt(document.getElementById('seedInput').value) || 2026;
      const w = 60;
      const h = 180;

      const container = document.getElementById('variantsGrid');
      container.innerHTML = '';

      // Generate 6 distinct variants with perfectly aligned parallel pipes
      for (let i = 0; i < 6; i++) {
        const variantSeed = baseSeed + i * 997;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.className = 'pixelated w-[90px] h-[270px] sm:w-[100px] sm:h-[300px] border border-slate-700/80 rounded-xl bg-slate-950 cursor-pointer shadow-md hover:border-indigo-500 transition-all';
        
        renderWallVariant(canvas, variantSeed, i);

        canvas.onclick = () => {
          const link = document.createElement('a');
          link.download = `sewer_wall_60x180_variant_${i + 1}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        };

        const wrapper = document.createElement('div');
        wrapper.className = 'flex flex-col items-center gap-2';
        
        const label = document.createElement('span');
        label.className = 'text-xs font-mono text-slate-400';
        label.innerText = `Variant #${i + 1}`;

        wrapper.appendChild(canvas);
        wrapper.appendChild(label);
        container.appendChild(wrapper);
      }
    }

    function renderWallVariant(canvas, seedVal, variantIndex) {
      const ctx = canvas.getContext('2d');
      const rng = new Random(seedVal);
      const w = canvas.width;
      const h = canvas.height;

      // 1. Background grayish brick wall (60x180)
      ctx.fillStyle = '#262930';
      ctx.fillRect(0, 0, w, h);

      const brickRows = 12;
      const rowH = h / brickRows;
      const brickCols = 2;
      const colW = w / brickCols;

      for (let r = 0; r < brickRows; r++) {
        for (let c = 0; c <= brickCols; c++) {
          const bx = c * colW - ((r % 2 === 0) ? 0 : colW / 2);
          const by = r * rowH;
          const bw = colW;
          const bh = rowH;

          const shade = rng.int(34, 52);
          ctx.fillStyle = `rgb(${shade}, ${shade + 2}, ${shade + 6})`;
          ctx.fillRect(bx + 1, by + 1, bw - 2, bh - 2);

          ctx.fillStyle = '#17191e';
          ctx.fillRect(bx, by + bh - 1, bw, 1);
          ctx.fillRect(bx + bw - 1, by, 1, bh);
        }
      }

      // Add wall cracks/stains
      for (let i = 0; i < 3; i++) {
        const cx = rng.range(10, w - 10);
        const cy = rng.range(20, h - 20);
        ctx.fillStyle = '#15171c';
        ctx.fillRect(cx, cy, rng.int(4, 8), rng.int(2, 4));
      }

      // 2. Random patches of moss
      const mossCount = rng.int(2, 5);
      for (let m = 0; m < mossCount; m++) {
        const mx = rng.range(5, w - 15);
        const my = rng.range(10, h - 20);
        const mw = rng.int(10, 18);
        const mh = rng.int(6, 12);

        ctx.fillStyle = '#2e4d2b';
        ctx.beginPath();
        ctx.ellipse(mx + mw/2, my + mh/2, mw/2, mh/2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#416d3c';
        ctx.fillRect(mx + mw/4, my + mh/4, mw/2, mh/2);
      }

      // 3. Fixed Parallel Horizontal Pipes (Consistent Y positions across all variants)
      const pipeY1 = h * 0.35; // Upper parallel pipe
      const pipeY2 = h * 0.70; // Lower parallel pipe
      const pHeight = 8;

      [pipeY1, pipeY2].forEach(py => {
        // Pipe shadow
        ctx.fillStyle = '#13151a';
        ctx.fillRect(0, py - pHeight/2 + 2, w, pHeight);

        // Main pipe body
        ctx.fillStyle = '#4a4f5c';
        ctx.fillRect(0, py - pHeight/2, w, pHeight);

        // Pipe highlight
        ctx.fillStyle = '#788194';
        ctx.fillRect(0, py - pHeight/2, w, 2);

        // Mounting clamps
        [w * 0.3, w * 0.7].forEach(bx => {
          ctx.fillStyle = '#323640';
          ctx.fillRect(bx - 3, py - pHeight/2 - 2, 6, pHeight + 4);
          ctx.fillStyle = '#8c98ad';
          ctx.fillRect(bx - 1, py - pHeight/2 - 2, 2, pHeight + 4);
        });
      });

      // 4. Vertical H/I connector drops joining the two parallel pipes (on specific variants like index 1, 3, 5)
      const hasVerticalDrop = (variantIndex % 2 === 1);
      if (hasVerticalDrop) {
        const dropX = w * 0.5;
        const vWidth = pHeight;

        // Vertical pipe shadow & body
        ctx.fillStyle = '#13151a';
        ctx.fillRect(dropX - vWidth/2 + 2, pipeY1, vWidth, pipeY2 - pipeY1);
        ctx.fillStyle = '#4a4f5c';
        ctx.fillRect(dropX - vWidth/2, pipeY1, vWidth, pipeY2 - pipeY1);
        ctx.fillStyle = '#788194';
        ctx.fillRect(dropX - vWidth/2, pipeY1, 2, pipeY2 - pipeY1);

        // T-junction collars
        [pipeY1, pipeY2].forEach(y => {
          ctx.fillStyle = '#323640';
          ctx.fillRect(dropX - vWidth/2 - 2, y - 3, vWidth + 4, 6);
          ctx.fillStyle = '#8c98ad';
          ctx.fillRect(dropX - vWidth/2 - 2, y - 1, vWidth + 4, 2);
        });
      }

      // 5. Pipe outlet holes (on alternating variants without vertical drops)
      if (!hasVerticalDrop && variantIndex % 4 === 0) {
        const ox = w * 0.5;
        const oy = pipeY1 + 25;
        const or = 7;

        ctx.fillStyle = '#0a0b0e';
        ctx.beginPath();
        ctx.arc(ox, oy, or, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#5a626d';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ox, oy, or, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#4c8a38';
        ctx.fillRect(ox - 2, oy + or, 4, 20);
      }
    }

    function downloadSpriteSheet() {
      const w = 60;
      const h = 180;
      const sheetCanvas = document.createElement('canvas');
      sheetCanvas.width = w * 6;
      sheetCanvas.height = h;
      const sCtx = sheetCanvas.getContext('2d');

      const baseSeed = parseInt(document.getElementById('seedInput').value) || 2026;

      for (let i = 0; i < 6; i++) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = w;
        tempCanvas.height = h;
        renderWallVariant(tempCanvas, baseSeed + i * 997, i);
        sCtx.drawImage(tempCanvas, i * w, 0);
      }

      const link = document.createElement('a');
      link.download = 'sewer_walls_60x180_spritesheet.png';
      link.href = sheetCanvas.toDataURL('image/png');
      link.click();
    }

    window.onload = () => {
      generateAll();
    };
  </script>
</body>
</html>
