<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cave Bat Mob - Hurt / Falling States Generator (Fixed Head & Tail)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
    }
    .pixelated {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .checkerboard {
      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 sm:p-8">

  <!-- Header -->
  <header class="text-center mb-8 max-w-2xl">
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">🦇 Low-Poly Cave Bat (Hurt / Falling — Fixed)</h1>
    <p class="text-slate-400 text-sm">Clean Head Silhouette with Tucked Tail & Tumbling Tilt (300px × 300px)</p>
  </header>

  <!-- Main Grid -->
  <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-8 items-start">

    <!-- Card 1: Regular Hurt Sprite -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col items-center gap-5">
      <div class="flex items-center justify-between w-full border-b border-slate-800 pb-3">
        <h2 class="text-sm font-bold uppercase tracking-wider text-purple-400">1. Regular Hurt / Falling</h2>
        <span class="text-xs text-slate-500 font-mono">bat_hurt_reg.png</span>
      </div>

      <div class="checkerboard p-6 rounded-xl border border-slate-800 shadow-inner flex justify-center items-center">
        <canvas id="canvasHurtReg" width="300" height="300" class="pixelated w-[200px] h-[200px] border border-slate-700/50 rounded-xl shadow-lg bg-transparent"></canvas>
      </div>

      <button onclick="downloadCanvas('canvasHurtReg', 'bat_hurt_reg.png')" class="w-full py-3 px-4 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-xl shadow-lg shadow-purple-600/30 transition-all flex items-center justify-center gap-2">
        💾 Export bat_hurt_reg.png
      </button>
    </div>

    <!-- Card 2: Red Flash Hurt Sprite -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col items-center gap-5">
      <div class="flex items-center justify-between w-full border-b border-slate-800 pb-3">
        <h2 class="text-sm font-bold uppercase tracking-wider text-red-400">2. Red Flash Hurt</h2>
        <span class="text-xs text-slate-500 font-mono">bat_hurt_red.png</span>
      </div>

      <div class="checkerboard p-6 rounded-xl border border-slate-800 shadow-inner flex justify-center items-center">
        <canvas id="canvasHurtRed" width="300" height="300" class="pixelated w-[200px] h-[200px] border border-slate-700/50 rounded-xl shadow-lg bg-transparent"></canvas>
      </div>

      <button onclick="downloadCanvas('canvasHurtRed', 'bat_hurt_red.png')" class="w-full py-3 px-4 bg-red-600 hover:bg-red-500 text-white font-semibold rounded-xl shadow-lg shadow-red-600/30 transition-all flex items-center justify-center gap-2">
        💾 Export bat_hurt_red.png
      </button>
    </div>

  </div>

  <script>
    const FRAME_SIZE = 300;

    function drawHurtBat(ctx, isRedFilter = false) {
      ctx.clearRect(0, 0, FRAME_SIZE, FRAME_SIZE);

      const cx = 150;
      const cy = 155;

      ctx.save();

      // Slight tumble tilt angle (12 degrees) to signal falling momentum
      ctx.translate(cx, cy);
      ctx.rotate(-0.21); // ~12 degrees rotation
      ctx.translate(-cx, -cy);

      // Color Palettes
      let bodyDark, bodyMid, bodyLight, wingMembrane, wingMembraneInner, wingMembraneLower, wingBone, outline;

      if (isRedFilter) {
        bodyDark = '#580c0c';
        bodyMid = '#881313';
        bodyLight = '#b91c1c';
        wingMembrane = '#450a0a';
        wingMembraneInner = '#6a0f0f';
        wingMembraneLower = '#530b0b';
        wingBone = '#2c0404';
        outline = '#1a0202';
      } else {
        bodyDark = '#141221';
        bodyMid = '#1e1b2e';
        bodyLight = '#2e2a4a';
        wingMembrane = '#12101e';
        wingMembraneInner = '#1a1829';
        wingMembraneLower = '#171526';
        wingBone = '#0b0a13';
        outline = '#050409';
      }

      function drawPoly(pts, fill, stroke = outline, lineW = 2.5) {
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) {
          ctx.lineTo(pts[i][0], pts[i][1]);
        }
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineW;
          ctx.stroke();
        }
      }

      const wingYOffset = cy - 22;
      
      // Asymmetrical recoiling wing positions
      const lElbowX = cx - 55;
      const lElbowY = wingYOffset + 8;
      const lTipX = cx - 125;
      const lTipY = wingYOffset + 42;
      const lMidBoneX = cx - 90;
      const lMidBoneY = wingYOffset + 62;
      const lLowerTipX = cx - 45;
      const lLowerTipY = wingYOffset + 68;

      // Right wing droops slightly lower from hit impact
      const rElbowX = cx + 55;
      const rElbowY = wingYOffset + 18;
      const rTipX = cx + 120;
      const rTipY = wingYOffset + 62;
      const rMidBoneX = cx + 86;
      const rMidBoneY = wingYOffset + 76;
      const rLowerTipX = cx + 42;
      const rLowerTipY = wingYOffset + 78;

      // --- 1. LEFT WING ---
      drawPoly([[cx - 12, wingYOffset - 5], [lElbowX, lElbowY], [lMidBoneX, lMidBoneY]], wingMembraneInner);
      drawPoly([[lElbowX, lElbowY], [lTipX, lTipY], [lMidBoneX, lMidBoneY]], wingMembrane);
      drawPoly([[cx - 12, wingYOffset - 5], [lMidBoneX, lMidBoneY], [lLowerTipX, lLowerTipY]], wingMembraneInner);
      drawPoly([[cx - 12, wingYOffset + 15], [lLowerTipX, lLowerTipY], [cx - 12, cy + 20]], wingMembraneLower);

      drawPoly([[cx - 12, wingYOffset - 5], [lElbowX, lElbowY], [lTipX, lTipY], [lElbowX - 2, lElbowY + 4]], wingBone);
      drawPoly([[lElbowX, lElbowY], [lMidBoneX, lMidBoneY]], wingBone);

      // --- 2. RIGHT WING ---
      drawPoly([[cx + 12, wingYOffset - 5], [rElbowX, rElbowY], [rMidBoneX, rMidBoneY]], wingMembraneInner);
      drawPoly([[rElbowX, rElbowY], [rTipX, rTipY], [rMidBoneX, rMidBoneY]], wingMembrane);
      drawPoly([[cx + 12, wingYOffset - 5], [rMidBoneX, rMidBoneY], [rLowerTipX, rLowerTipY]], wingMembraneInner);
      drawPoly([[cx + 12, wingYOffset + 15], [rLowerTipX, rLowerTipY], [cx + 12, cy + 20]], wingMembraneLower);

      drawPoly([[cx + 12, wingYOffset - 5], [rElbowX, rElbowY], [rTipX, rTipY], [rElbowX + 2, rElbowY + 4]], wingBone);
      drawPoly([[rElbowX, rElbowY], [rMidBoneX, rMidBoneY]], wingBone);


      // --- 3. REAR TORSO (TAIL CLEVERLY TUCKED UNDERNEATH) ---
      // Clean back shoulder ridge
      drawPoly([[cx, cy - 25], [cx - 22, cy - 10], [cx - 14, cy + 18], [cx, cy + 24]], bodyDark);
      drawPoly([[cx, cy - 25], [cx + 22, cy - 10], [cx + 14, cy + 18], [cx, cy + 24]], bodyMid);

      drawPoly([[cx, cy - 23], [cx - 12, cy - 8], [cx, cy + 12]], bodyDark);
      drawPoly([[cx, cy - 23], [cx + 12, cy - 8], [cx, cy + 12]], bodyMid);

      // Small Tail Tip safely tucked behind upper body seam (no floating top tip)
      drawPoly([[cx - 3, cy - 22], [cx, cy - 17], [cx + 3, cy - 22]], bodyDark);


      // --- 4. CLEAR DOWNWARD HEAD & EARS ---
      const headY = cy + 12;

      // Ears pointing downward/forward
      drawPoly([[cx - 16, headY - 10], [cx - 24, headY - 34], [cx - 4, headY - 18]], bodyMid);
      drawPoly([[cx - 14, headY - 12], [cx - 21, headY - 30], [cx - 6, headY - 17]], bodyDark);

      drawPoly([[cx + 4, headY - 18], [cx + 24, headY - 34], [cx + 16, headY - 10]], bodyLight);
      drawPoly([[cx + 6, headY - 17], [cx + 21, headY - 30], [cx + 14, headY - 12]], bodyMid);

      // Head Crown & Snout Profile
      drawPoly([[cx - 14, headY - 18], [cx, headY - 22], [cx + 14, headY - 18], [cx, headY - 2]], bodyLight);
      drawPoly([[cx - 6, headY - 8], [cx, headY - 2], [cx + 6, headY - 8]], bodyDark);

      ctx.restore();
    }

    function renderSprites() {
      drawHurtBat(document.getElementById('canvasHurtReg').getContext('2d'), false);
      drawHurtBat(document.getElementById('canvasHurtRed').getContext('2d'), true);
    }

    function downloadCanvas(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    window.onload = renderSprites;
  </script>
</body>
</html>
